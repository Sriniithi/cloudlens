name: CloudLens AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data
        run: python ingestion/generate_data.py

      - name: Load into DuckDB
        run: python ingestion/load_to_duckdb.py

      - name: Copy raw as clean for CI
        run: cp data/azure_billing_raw.csv data/azure_billing_clean.csv

      - name: Setup DuckDB schema
        run: python processing/load_cleaned_data.py

      - name: Run attribution model
        run: python processing/attribution_model.py

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server and pull model
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2:1b
          sleep 5

      - name: Run AI optimization engine
        run: python ai_engine/gemini_engine.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run budget forecast
        run: python processing/budget_forecast.py

      - name: Run anomaly detection
        run: python ai_engine/anomaly_engine.py

      - name: Generate scale dataset
        run: python ingestion/generate_scale_data.py

      - name: Run Locust benchmarks
        run: python tests/locustfile.py

      - name: Run all tests with coverage
        run: |
          pip install pytest-cov
          pytest tests/ -v --tb=short \
            --cov=ingestion \
            --cov=processing \
            --cov=ai_engine \
            --cov=chat_interface/utils.py \
            --cov-report=term-missing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}